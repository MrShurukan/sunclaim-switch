[package]
name = "rust_game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
test = false
bench = false
doctest = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
game_core = { path = "../game_core" }

# For trigonometry
libm = "0.2"

# For AsepriteSheet
# TODO: Make these optional so people without the need for AsepriteSheet won't actually need this
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }

derive_more = { version = "2", default-features = false, features = ["from", "display"] }